services:
  mongodb:
    image: mongo:latest
    container_name: arena-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - arena_net

  arena:
    build: .
    container_name: arena-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE_NAME=cyber_algo_arena
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./contest_data:/app/contest_data
    networks:
      - arena_net

volumes:
  mongo_data:

networks:
  arena_net:
    driver: bridge
