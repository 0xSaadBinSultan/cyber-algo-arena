name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MONGODB_TEST_URI: mongodb://localhost:27018/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start isolated replica set for transaction tests
        run: |
          docker run -d --name arena-mongo-tests -p 27018:27017 mongo:8.0 --replSet arenaTest --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec arena-mongo-tests mongosh --quiet --eval 'rs.initiate({_id:"arenaTest",members:[{_id:0,host:"localhost:27017"}]})'; then break; fi
            sleep 1
          done
          for attempt in $(seq 1 30); do
            if docker exec arena-mongo-tests mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
