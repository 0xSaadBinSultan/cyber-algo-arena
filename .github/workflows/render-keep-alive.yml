name: Render Always-On Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Render Server
        run: |
          echo "Pinging Cyber-Algo Arena on Render..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://cyber-algo-arena-3.onrender.com/api/health)
          echo "HTTP Response Status: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 301 ] || [ "$RESPONSE" -eq 302 ]; then
            echo "Server is awake and active!"
          else
            echo "Warning: Received HTTP $RESPONSE"
          fi
