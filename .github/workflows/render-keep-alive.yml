name: Render Liveness Check

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping live Render server
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://cyber-algo-arena-3.onrender.com/api/health/live >/dev/null
