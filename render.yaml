services:
  - type: web
    name: cyber-algo-arena-3
    runtime: docker
    plan: free
    region: oregon
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE_NAME
        value: cyber_algo_arena
      - key: ARENA_ADMIN_USERNAME
        value: admin
      - key: ARENA_ADMIN_PASSWORD
        sync: false
