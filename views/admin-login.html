<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Cyber-Algo Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0d0405] text-white flex items-center justify-center min-h-screen font-mono">
  <div class="bg-[#120708] border-2 border-red-500/60 max-w-md w-full rounded-xl shadow-[0_0_40px_rgba(248,81,73,0.3)] overflow-hidden">
    <div class="p-4 bg-red-500/15 border-b border-red-500/40 flex items-center justify-between">
      <div class="flex items-center gap-2.5 text-red-500">
        <i class="fa-solid fa-triangle-exclamation text-lg animate-pulse"></i>
        <div>
          <div class="text-xs font-black tracking-wider uppercase">RESTRICTED ACCESS PORTAL</div>
          <div class="text-[10px] text-red-300 font-sans">Authorized Operations Personnel Only</div>
        </div>
      </div>
    </div>
    <form id="form-admin-login" class="p-6 space-y-4 text-xs">
      <div class="p-2.5 bg-red-950/40 border border-red-500/30 rounded text-[11px] text-red-300 leading-relaxed font-sans">
        <i class="fa-solid fa-shield-halved text-red-500 mr-1"></i>
        Elevated root clearance required. Unsanctioned access attempts are logged with client network telemetry.
      </div>
      <div>
        <label class="block text-gray-400 mb-1 font-semibold uppercase text-[10px]">Root Identifier</label>
        <input type="text" id="admin-login-username" required placeholder="admin" class="w-full bg-[#0d0405] border border-red-500/40 focus:border-red-500 focus:ring-1 focus:ring-red-500 rounded px-3 py-2 text-white outline-none">
      </div>
      <div>
        <label class="block text-gray-400 mb-1 font-semibold uppercase text-[10px]">Access Key</label>
        <input type="password" id="admin-login-password" required placeholder="••••••••••••" class="w-full bg-[#0d0405] border border-red-500/40 focus:border-red-500 focus:ring-1 focus:ring-red-500 rounded px-3 py-2 text-white outline-none">
      </div>
      <button type="submit" id="btn-admin-login-submit" class="w-full py-2.5 bg-red-600 hover:bg-red-500 text-white font-bold rounded text-xs transition-colors flex items-center justify-center gap-2 shadow-lg shadow-red-900/30">
        <i class="fa-solid fa-lock-open text-xs"></i>
        <span>Authenticate Root Clearance</span>
      </button>
      <div class="text-center pt-2">
        <a href="/" class="text-[11px] text-gray-500 hover:text-white underline font-sans">Return to Arena</a>
      </div>
    </form>
  </div>
  <script>
    document.getElementById('form-admin-login').onsubmit = async (e) => {
      e.preventDefault();
      const u = document.getElementById('admin-login-username').value;
      const p = document.getElementById('admin-login-password').value;
      const btn = document.getElementById('btn-admin-login-submit');
      btn.disabled = true;
      btn.innerHTML = 'Authenticating...';
      try {
        const res = await fetch('/api/auth/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        if (res.ok) {
          window.location.href = '/admin';
        } else {
          alert('Authentication denied.');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-lock-open text-xs"></i><span>Authenticate Root Clearance</span>';
        }
      } catch (err) {
        alert('Error connecting to server.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-lock-open text-xs"></i><span>Authenticate Root Clearance</span>';
      }
    };
  </script>
</body>
</html>
